name: Build ARMv7 Chromium

on:
  # A dedicated marker lets repository automation start a clean build without
  # making every source/documentation push consume several runner jobs.
  push:
    branches:
      - main
    paths:
      - .github/build-armv7.trigger
  workflow_dispatch:
    inputs:
      chromium_ref:
        description: Chromium commit, tag, or branch; empty uses pinned revision
        required: false
        type: string
      use_tip_of_tree:
        description: Build current Chromium main
        required: true
        default: false
        type: boolean
      publish_release:
        description: Publish signed APK in GitHub Releases
        required: true
        default: true
        type: boolean
      continuation_attempt:
        description: Internal build continuation counter
        required: true
        default: "0"
        type: string
      advance_pin_after_success:
        description: Internal flag for scheduled build continuations
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  actions: write

concurrency:
  group: chromium-armv7-release
  # A continuation is queued before the current job finishes its cleanup.
  # Never let that new run cancel the job that just saved its checkpoint.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CHROMIUM_WORK_ROOT: ${{ github.workspace }}/.work
      # Public Linux runners provide 4 CPU / 16 GB. Keep one Clang worker per
      # core: six workers can exhaust RAM when several large Blink translation
      # units miss the cache at the same time and kill the hosted runner.
      NINJA_JOBS: "4"
      GCLIENT_JOBS: "4"
      NINJA_SUMMARIZE_BUILD: "1"
      NINJA_STATUS: "[%f/%t %o/sec %es] "
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "8G"
      CCACHE_COMPRESS: "true"
      CCACHE_COMPILERCHECK: "content"
      # Chromium 142+ enables Clang modules. Ccache treats module compilations
      # as uncacheable unless depend mode and module sloppiness are enabled.
      # Every continuation builds the exact same pinned source and toolchain.
      CCACHE_DEPEND: "true"
      # gclient and GN recreate generated headers in every fresh runner. Their
      # contents are pinned, but their ctime/mtime are not; ignoring only those
      # timestamps lets direct-mode entries survive across continuation jobs.
      CCACHE_SLOPPINESS: "time_macros,modules,include_file_ctime,include_file_mtime"
      CCACHE_BASEDIR: ${{ github.workspace }}/.work/chromium/src
      ANDROID_KEY_ALIAS: chromium_armv7_extensions
      EXPECTED_CERT_SHA256: 90266730e98c8a40c53694f06c33ab8201968afea039e3ce7347fd7f42ead4f2

    steps:
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$KEYSTORE_B64" ]]
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]]

      - name: Remove unused preinstalled toolchains
        run: |
          set -Eeuo pipefail
          sudo rm -rf -- \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/lib/jvm \
            /usr/local/graalvm \
            /usr/local/lib/node_modules \
            /usr/local/share/vcpkg \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /usr/local/julia* \
            /opt/az \
            /opt/microsoft \
            /opt/pipx \
            /opt/google/chrome
          sudo apt-get clean
          sudo rm -rf -- /var/lib/apt/lists/* /var/cache/apt/*
          if command -v docker >/dev/null 2>&1; then
            docker system prune --all --force --volumes || true
          fi
          df -h / /mnt

      # install-build-deps writes into /usr and /var on the root filesystem.
      # Do this while the cleaned runner still has plenty of root space; the
      # build-volume action below deliberately pools most remaining free space.
      - name: Check out dependency preflight files
        uses: actions/checkout@v4

      - name: Install Chromium host build dependencies
        run: |
          set -Eeuo pipefail
          source config/chromium.env
          installer="$RUNNER_TEMP/install-build-deps.py"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/chromium/chromium/${CHROMIUM_COMMIT}/build/install-build-deps.py" \
            --output "$installer"
          python3 "$installer" \
            --no-prompt \
            --no-syms \
            --lib32 \
            --no-arm \
            --no-chromeos-fonts \
            --no-backwards-compatible
          sudo apt-get install -y --no-install-recommends ccache
          rm -f "$installer"
          sudo apt-get clean
          sudo rm -rf -- /var/lib/apt/lists/* /var/cache/apt/*
          df -h / /mnt

      # Pin the reviewed v10 commit. It joins the free space on / and /mnt
      # into one disposable build volume mounted at GITHUB_WORKSPACE. On
      # runners where /mnt shares the root device, temp-reserve-mb is also the
      # final root reserve, so keep 1 GiB for Actions bookkeeping.
      - name: Create large workspace volume
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          root-reserve-mb: "4096"
          temp-reserve-mb: "1024"
          swap-size-mb: "2048"
          overprovision-lvm: "false"

      - name: Check out build repository
        uses: actions/checkout@v4

      - name: Report runner disk space
        run: bash ./scripts/free-github-runner-disk.sh

      - name: Select Chromium revision
        id: revision
        env:
          INPUT_REF: ${{ inputs.chromium_ref }}
          INPUT_TIP: ${{ inputs.use_tip_of_tree }}
        run: |
          set -Eeuo pipefail
          source config/chromium.env
          if [[ "${{ github.event_name }}" == "schedule" || "$INPUT_TIP" == "true" ]]; then
            ref=main
          elif [[ -n "$INPUT_REF" ]]; then
            ref="$INPUT_REF"
          else
            ref="$CHROMIUM_COMMIT"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Fetch Chromium and dependencies
        id: chromium
        env:
          CHROMIUM_REF: ${{ steps.revision.outputs.ref }}
        run: |
          set -Eeuo pipefail
          bash ./scripts/bootstrap.sh
          source "$CHROMIUM_WORK_ROOT/resolved-chromium.env"
          echo "commit=$RESOLVED_CHROMIUM_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Restore compiler checkpoint
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: chromium-armv7-ccache-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            chromium-armv7-ccache-v2-

      - name: Compile chrome_public_apk
        id: compile
        run: |
          set -Eeuo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --zero-stats

          # Leave more than an hour of the six-hour job limit for checkout,
          # cache transfer, final signing, and publication. With the warmed
          # cache this long slice can finish compilation and packaging at once.
          set +e
          timeout --signal=INT --kill-after=120s 17100s bash ./scripts/build.sh
          status=$?
          set -e

          ccache --show-stats --verbose
          ccache --cleanup

          if [[ "$status" -eq 0 ]]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 124 || "$status" -eq 130 || \
                  "$status" -eq 137 || "$status" -eq 143 ]]; then
            echo "Build slice completed; saving a checkpoint for continuation."
            echo "complete=false" >> "$GITHUB_OUTPUT"
          else
            echo "Compilation failed with status $status" >&2
            exit "$status"
          fi

      - name: Save compiler checkpoint
        if: always() && steps.compile.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: chromium-armv7-ccache-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Queue continuation build
        if: steps.compile.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ATTEMPT: ${{ inputs.continuation_attempt }}
          RESOLVED_COMMIT: ${{ steps.chromium.outputs.commit }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          INPUT_ADVANCE_PIN: ${{ inputs.advance_pin_after_success }}
        run: |
          set -Eeuo pipefail
          attempt="${CURRENT_ATTEMPT:-0}"
          next_attempt=$((attempt + 1))
          if (( next_attempt > 12 )); then
            echo "Build still needs another slice after twelve continuations." >&2
            exit 1
          fi

          publish_release="${INPUT_PUBLISH_RELEASE:-true}"
          advance_pin="${INPUT_ADVANCE_PIN:-false}"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            publish_release=true
            advance_pin=true
          fi

          gh workflow run build-armv7.yml \
            --ref "$GITHUB_REF_NAME" \
            -f chromium_ref="$RESOLVED_COMMIT" \
            -f use_tip_of_tree=false \
            -f publish_release="$publish_release" \
            -f continuation_attempt="$next_attempt" \
            -f advance_pin_after_success="$advance_pin"

      - name: Decode private release key
        if: steps.compile.outputs.complete == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"

      - name: Sign and verify APK
        if: steps.compile.outputs.complete == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          bash ./scripts/sign-apk.sh "$RUNNER_TEMP/release.p12"
          bash ./scripts/verify-apk.sh dist/Chromium-ARMv7-Extensions-signed.apk

      - name: Read build metadata
        if: steps.compile.outputs.complete == 'true'
        id: metadata
        run: |
          set -Eeuo pipefail
          version="$(jq -r .chromium_version dist/build-metadata.json)"
          commit="$(jq -r .chromium_commit dist/build-metadata.json)"
          position="$(jq -r .chromium_commit_position dist/build-metadata.json)"
          short_commit="${commit:0:12}"
          tag="chromium-${version}-r${position}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short_commit=$short_commit" >> "$GITHUB_OUTPUT"
          echo "position=$position" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload durable Actions artifact
        if: steps.compile.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Chromium-${{ steps.metadata.outputs.version }}-armeabi-v7a
          path: |
            dist/Chromium-ARMv7-Extensions-signed.apk
            dist/build-metadata.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: steps.compile.outputs.complete == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          COMMIT: ${{ steps.metadata.outputs.commit }}
          POSITION: ${{ steps.metadata.outputs.position }}
        run: |
          set -Eeuo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Chromium **$VERSION** for Android armeabi-v7a."
            echo
            echo "- Upstream commit: \`$COMMIT\`"
            echo "- Commit position: \`$POSITION\`"
            echo "- Desktop Android extensions: enabled"
            echo "- Package: \`org.chromium.chrome\`"
            echo "- Certificate SHA-256: \`$EXPECTED_CERT_SHA256\`"
            echo
            echo "Experimental build: keep a backup of important browser data."
          } > "$notes"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/Chromium-ARMv7-Extensions-signed.apk \
              dist/build-metadata.json --clobber
          else
            gh release create "$TAG" \
              dist/Chromium-ARMv7-Extensions-signed.apk \
              dist/build-metadata.json \
              --title "Chromium $VERSION ARMv7 + extensions" \
              --notes-file "$notes"
          fi

      - name: Advance pinned revision after scheduled success
        if: steps.compile.outputs.complete == 'true' && (github.event_name == 'schedule' || inputs.advance_pin_after_success)
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          COMMIT: ${{ steps.metadata.outputs.commit }}
          POSITION: ${{ steps.metadata.outputs.position }}
        run: |
          set -Eeuo pipefail
          {
            echo "# Last revision successfully built, signed, and verified."
            echo "CHROMIUM_VERSION=$VERSION"
            echo "CHROMIUM_COMMIT=$COMMIT"
            echo "CHROMIUM_COMMIT_POSITION=$POSITION"
          } > config/chromium.env
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/chromium.env
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin Chromium $VERSION"
            git push
          fi
